name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, build, guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: No tracked env files
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Env files must not be committed:"; echo "$tracked"; exit 1
          fi

      - name: Install
        run: npm ci

      - name: Client env and provider-call guard
        run: npm run check:client-env

      # Full compiler output is also emitted as one annotation: GitHub caps
      # per-error annotations at 10 per step, which hides later errors.
      - name: Typecheck (server)
        run: |
          if ! npm run typecheck > tsc.log 2>&1; then
            cat tsc.log
            node -e 'const l=require("fs").readFileSync("tsc.log","utf8").split("\n").filter(x=>/error TS/.test(x));console.log(`::error title=tsc (${l.length} errors)::`+l.slice(0,80).join("%0A"))'
            exit 1
          fi

      - name: Typecheck (client)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build (client + server bundle)
        run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Blocks on critical. Known highs (xlsx: no npm fix, moving to the SheetJS
      # CDN build; zod: needs the v4 major) are surfaced as annotations until
      # their fix PRs land. Tighten to --audit-level=high once they do.
      - name: npm audit (production dependencies, blocking on critical)
        run: npm audit --omit=dev --audit-level=critical
      - name: Report high-severity findings
        if: always()
        run: |
          npm audit --omit=dev --json > audit.json || true
          node -e '
            const a = require("./audit.json");
            for (const [name, v] of Object.entries(a.vulnerabilities || {})) {
              if (!["high", "critical"].includes(v.severity)) continue;
              const via = (v.via || []).map(x => typeof x === "string" ? x : x.title).join("; ").slice(0, 300);
              console.log(`::warning title=audit ${v.severity}::${name} (${v.range}): ${via}`);
            }'


  e2e:
    name: End-to-end (admin, professor, student)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: learnit_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGURL: postgres://postgres:postgres@127.0.0.1:5432/learnit_e2e
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/learnit_e2e?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Database (shim + all migrations + test accounts)
        run: e2e/setup-db.sh
      - name: Browser
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Start Supabase stand-in, API and frontend
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_ROLE_KEY: e2e-service-role
          PUBLIC_API_URL: http://127.0.0.1:3001
          PORT: '3001'
          NODE_ENV: development
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: e2e-anon
          VITE_API_BASE_URL: http://127.0.0.1:3001
        run: |
          nohup node e2e/supabase-mock.mjs > mock.log 2>&1 &
          nohup npx tsx server.ts > api.log 2>&1 &
          { npx vite build && node scripts/prerender.mjs; } > vite-build.log 2>&1 || { cat vite-build.log; exit 1; }
          nohup npx vite preview --host 127.0.0.1 --port 4173 --strictPort > web.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/api/health > /dev/null && curl -fsS http://127.0.0.1:4173 > /dev/null; then echo ready; exit 0; fi
            sleep 2
          done
          echo "::error::stack did not start"; tail -50 api.log mock.log web.log; exit 1
      - name: Run end-to-end checks
        run: node e2e/roles.mjs
      - name: Tenant isolation (API, grants, RLS)
        if: always()
        run: node e2e/tenancy.mjs
      - name: Report
        if: always()
        run: |
          [ -f e2e-report/report.md ] && cat e2e-report/report.md >> "$GITHUB_STEP_SUMMARY"
          echo "── API log (last 80 lines)"; tail -80 api.log || true
          echo "── Supabase stand-in log"; tail -30 mock.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            e2e-report
            api.log
          retention-days: 7

  docker:
    name: API container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Cloud Run image
        run: docker build -t learnit-api:ci .
      - name: Image starts and serves /api/health
        run: |
          # Placeholder config: only checks the server boots and answers.
          # Every DB call fails fast because nothing listens on that port.
          docker run -d --name api -p 8080:8080 \
            -e DATABASE_URL=postgres://ci:ci@127.0.0.1:1/ci \
            -e SUPABASE_URL=https://example.supabase.co \
            -e SUPABASE_SERVICE_ROLE_KEY=ci-placeholder \
            -e ALLOWED_ORIGIN=https://example.com \
            learnit-api:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/api/health; then echo; docker rm -f api >/dev/null; exit 0; fi
            sleep 2
          done
          docker logs api
          exit 1
