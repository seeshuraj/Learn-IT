name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, build, guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: No tracked env files
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Env files must not be committed:"; echo "$tracked"; exit 1
          fi

      - name: Install
        run: npm ci

      - name: Client env and provider-call guard
        run: npm run check:client-env

      # Full compiler output is also emitted as one annotation: GitHub caps
      # per-error annotations at 10 per step, which hides later errors.
      - name: Typecheck (server)
        run: |
          if ! npm run typecheck > tsc.log 2>&1; then
            cat tsc.log
            node -e 'const l=require("fs").readFileSync("tsc.log","utf8").split("\n").filter(x=>/error TS/.test(x));console.log(`::error title=tsc (${l.length} errors)::`+l.slice(0,80).join("%0A"))'
            exit 1
          fi

      - name: Build (client + server bundle)
        run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Blocks on critical. Known highs (xlsx: no npm fix, moving to the SheetJS
      # CDN build; zod: needs the v4 major) are surfaced as annotations until
      # their fix PRs land. Tighten to --audit-level=high once they do.
      - name: npm audit (production dependencies, blocking on critical)
        run: npm audit --omit=dev --audit-level=critical
      - name: Report high-severity findings
        if: always()
        run: |
          npm audit --omit=dev --json > audit.json || true
          node -e '
            const a = require("./audit.json");
            for (const [name, v] of Object.entries(a.vulnerabilities || {})) {
              if (!["high", "critical"].includes(v.severity)) continue;
              const via = (v.via || []).map(x => typeof x === "string" ? x : x.title).join("; ").slice(0, 300);
              console.log(`::warning title=audit ${v.severity}::${name} (${v.range}): ${via}`);
            }'

