# One-off: fetch SheetJS 0.20.3 from its official CDN (newer versions are not
# on npm), store the tarball in vendor/, and update package.json and the
# lockfile. Removed again in the same pull request.
name: Vendor SheetJS xlsx 0.20.3 (one-off)
on:
  push:
    branches: [chore/xlsx-0.20.3]
    paths: [.github/workflows/vendor-xlsx.yml]
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download and record
        run: |
          set -euo pipefail
          mkdir -p vendor
          curl -fsSL https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz -o vendor/xlsx-0.20.3.tgz
          echo "sha256: $(sha256sum vendor/xlsx-0.20.3.tgz)"
          tar -xzOf vendor/xlsx-0.20.3.tgz package/package.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s);console.log(JSON.stringify({name:p.name,version:p.version,license:p.license,dependencies:p.dependencies,scripts:p.scripts},null,1))})'
          npm install --save --no-audit --no-fund --ignore-scripts "file:vendor/xlsx-0.20.3.tgz"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/xlsx-0.20.3.tgz package.json package-lock.json
          git commit -m "chore(deps): vendor SheetJS xlsx 0.20.3 from cdn.sheetjs.com"
          git push
