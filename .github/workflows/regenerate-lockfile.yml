# TEMPORARY: adds gsap and @gsap/react to package-lock.json on a runner (the
# authoring session cannot reach the npm registry). Keeps the existing lockfile
# so no other dependency moves. Delete in the next commit on this branch.
name: Update lockfile

on:
  push:
    branches: [feat/unified-brand-gsap]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update lockfile for new dependencies only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add gsap and @gsap/react to package-lock.json" || echo "no changes"
          git push
