# TEMPORARY: regenerates package-lock.json with npm on a runner (this repo's
# lockfile is stale and the authoring session cannot reach the registry).
# Runs only on pushes to this branch; delete after the lockfile is merged.
name: Regenerate lockfile

on:
  push:
    branches: [chore/regenerate-lockfile]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lockfile from package.json
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Report production audit as annotations
        run: |
          npm audit --omit=dev --json > audit.json || true
          node -e '
            const a = require("./audit.json");
            for (const [name, v] of Object.entries(a.vulnerabilities || {})) {
              const via = (v.via || []).map(x => typeof x === "string" ? x : x.title).join("; ").slice(0, 300);
              const fix = v.fixAvailable === false ? "no fix" : (v.fixAvailable && v.fixAvailable.isSemVerMajor ? "fix is semver-major" : "fix available");
              console.log(`::warning title=audit ${v.severity}::${name} (${v.range}) ${fix}: ${via}`);
            }'
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: regenerate package-lock.json from package.json" || echo "no changes"
          git push
